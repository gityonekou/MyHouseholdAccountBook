<!DOCTYPE html>
<html lang="ja" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
		rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
		crossorigin="anonymous">
<link th:href="@{/css/MyHouseholdAccountBookCommon.css}" rel="stylesheet" type="text/css">
<title>情報管理(銀行口座)</title>
</head>
<body>
	<!--/* ヘッダー */-->
	<div id="header" th:insert="~{layout/myhacbookheader::header}">ヘッダー</div>

	<!--/* ボディ部 */-->
	<div class="col">
		<div class="card">
			<div class="card-body">
				<h5 class="card-title">情報管理(銀行口座)</h5>
				<th:block th:each="message : ${messages}">
					<code><span th:text="${message}">何かのメッセージがある場合はここに表示</span></code></br>
				</th:block>
			</div>

			<!-- 銀行口座情報入力フォーム -->
			<form name="BankAccountInfoUpdate" class="d-flex" method="post" th:action="@{/myhacbook/managebaseinfo/bankaccountinfo/update/}" th:object="${bankAccountInfoForm}">
			<div class="card-body">
				<div class="mb-3">
					<label for="bankName" class="form-label">銀行名</label>
 					<input type="text" class="form-control w50" th:errorclass="is-invalid" th:field="*{bankName}" required>
 					<p class="invalid-feedback" th:errors="*{bankName}"></p>
				</div>
				<div class="mb-3">
					<label for="bankAccountMemo" class="form-label">口座メモ</label>
 					<input type="text" class="form-control w50" th:errorclass="is-invalid" th:field="*{bankAccountMemo}">
 					<p class="invalid-feedback" th:errors="*{bankAccountMemo}"></p>
				</div>
				<div class="mb-3">
					<label for="bankAccountSort" class="form-label">表示順</label>
 					<input type="text" class="form-control w10" th:errorclass="is-invalid" th:field="*{bankAccountSort}">
 					<p class="invalid-feedback" th:errors="*{bankAccountSort}"></p>
				</div>
				<div class="mb-3 form-check">
					<input type="checkbox" class="form-check-input" th:field="*{enableFlg}">
					<label for="enableFlg" class="form-check-label">有効</label>
				</div>
				<div class="mb-3">
					<button class="btn btn-primary" type="submit">登録</button>
					<input type="hidden" th:field="*{action}" />
					<input type="hidden" th:field="*{bankAccountCode}" />
					<input type="hidden" th:field="*{bankAccountSortBefore}" />
				</div>
			</div>
			</form>

			<!-- 銀行口座一覧表示エリア -->
			<div class="list-group">
				<a class="list-group-item list-group-item-secondary">表示順&emsp;銀行名&emsp;：口座メモ&emsp;：状態&emsp;&emsp;※更新する場合は対象行をクリックしてください</a>
				<a th:each="bankAccountItem : ${bankAccountList}" th:href="@{/myhacbook/managebaseinfo/bankaccountinfo/updateload(bankAccountCode=${bankAccountItem.bankAccountCode})}"
					th:class="${bankAccountItem.enableFlg} ? 'list-group-item list-group-item-action' : 'list-group-item list-group-item-action list-group-item-light'">
					<span th:text="${bankAccountItem.bankAccountSort}"></span>&emsp;<span th:text="${bankAccountItem.bankName}"></span>&emsp;：<span th:text="${bankAccountItem.bankAccountMemo}"></span>&emsp;：<span th:text="${bankAccountItem.enableFlg} ? '有効' : '無効'"></span>
				</a>
			</div>
		</div>
	</div>

	<!--/* フッター共通jsのインクルード) */-->
	<div id="footer" th:insert="~{layout/myhacbookfooter::footer}">フッター</div>

</body>
</html>
